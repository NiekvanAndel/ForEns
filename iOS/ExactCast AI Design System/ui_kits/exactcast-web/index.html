<script type="text/babel" src="NetworkPage.jsx"></script>
<script type="text/babel">
const { SiteHeader, SiteFooter } = window.ExactCastAIDesignSystem_6b62ae;
const LINKS=['Nowcast','Het netwerk','Prijzen','Kennis'];
function App(){
  const [page,setPage]=React.useState('Nowcast');
  const nav=k=>setPage(k==='home'?'Nowcast':k==='Netwerk'?'Het netwerk':k);
  React.useEffect(()=>{window.scrollTo(0,0);},[page]);
  return <div id="site">
    <SiteHeader links={LINKS} active={page} phone="073 782 03 40" cta="Download de app" onNav={nav}/>
    {page==='Prijzen'?<PricingPage onNav={nav}/>:page==='Het netwerk'?<NetworkPage/>:<HomePage onNav={nav}/>}
    <SiteFooter copyright="© ExactCast AI — onderdeel van AgroExact" legal={['Algemene voorwaarden','Privacy Statement']}
      columns={[
        {title:'Download de app',body:'Nu voor iOS. Android volgt.'},
        {title:'Product',links:['Nowcast','Het netwerk','Prijzen','Zekerheid uitgelegd']},
        {title:'Support',links:['Veelgestelde vragen','Handleiding','Contact']},
        {title:'Contact',body:'Helftheuvelweg 11, 5222 AV \u2019s-Hertogenbosch · info@exactcast.ai · +31 73 782 03 40'}]}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
