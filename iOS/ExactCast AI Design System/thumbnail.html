<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{width:1280px;height:854px;display:flex}
.main{flex:1;background:var(--navy);display:grid;place-items:center}
.mark{font-family:var(--font-core);font-size:150px;line-height:1;letter-spacing:-.02em;color:#fff;white-space:nowrap}
.mark b{font-weight:800}.mark i{font-style:normal;font-weight:500}.mark s{text-decoration:none;font-weight:800;color:var(--app-accent-dark)}
.strip{width:280px;display:flex;flex-direction:column}.strip div{flex:1}</style></head>
<body><div class="tile">
<div class="main"><div class="mark"><b>Exact</b><i>Cast</i><s> AI</s></div></div>
<div class="strip">
  <div style="background:#E9A13B"></div>
  <div style="background:#7BB570"></div>
  <div style="background:#5C9452"></div>
  <div style="background:#D9534F"></div>
</div></div></body></html>
