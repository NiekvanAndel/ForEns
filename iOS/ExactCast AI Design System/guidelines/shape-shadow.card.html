<!-- @dsCard group="Shape" viewport="700x180" name="Shadows" subtitle="Cards float on one soft 50px shadow — never a border" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-core);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);padding:16px 18px}
.sw{border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:96px;box-shadow:var(--shadow-card)}
.sw b{font-size:13px;font-weight:700;display:block}.sw span{font-size:11.5px;font-family:ui-monospace,monospace;opacity:.85}
.row{display:grid;gap:10px}</style></head><body><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
<div style="background:#fff;border-radius:16px;box-shadow:var(--shadow-card);padding:16px;width:210px"><b style="color:var(--ink-heading);font-size:14px">--shadow-card</b><div style="font-size:11.5px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:6px">0 18px 50px -24px rgba(9,28,61,.28)</div></div>
<div style="background:#fff;border-radius:10px;box-shadow:var(--shadow-float);padding:16px;width:190px"><b style="color:var(--ink-heading);font-size:14px">--shadow-float</b><div style="font-size:11.5px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:6px">0 4px 14px rgba(0,0,0,.13)</div></div>
<div style="background:#0d1b2e;border-radius:20px;box-shadow:var(--shadow-phone);padding:16px;width:190px;color:#fff"><b style="font-size:14px">--shadow-phone</b><div style="font-size:11.5px;color:var(--on-navy-muted);font-family:ui-monospace,monospace;margin-top:6px">0 30px 70px -30px rgba(0,0,0,.75)</div></div></div></body></html>
