<!-- @dsCard group="Colors" viewport="700x150" name="Ink & text" subtitle="Body, headings, muted — muted is contrast-corrected to 4.9:1" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-core);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);padding:16px 18px}
.sw{border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:96px;box-shadow:var(--shadow-card)}
.sw b{font-size:13px;font-weight:700;display:block}.sw span{font-size:11.5px;font-family:ui-monospace,monospace;opacity:.85}
.row{display:grid;gap:10px}</style></head><body><div class="row" style="grid-template-columns:repeat(4,1fr)">
<div class="sw" style="background:#1F3354;color:#fff"><b>Body</b><span>--ink</span><span>#1F3354</span></div><div class="sw" style="background:#0C2547;color:#fff"><b>Heading</b><span>--ink-heading</span><span>#0C2547</span></div><div class="sw" style="background:#4F6885;color:#fff"><b>Muted</b><span>--muted</span><span>#4F6885</span></div><div class="sw" style="background:#B4C0CE;color:var(--ink-heading)"><b>Disabled</b><span>--ink-disabled</span><span>#B4C0CE</span></div></div></body></html>
