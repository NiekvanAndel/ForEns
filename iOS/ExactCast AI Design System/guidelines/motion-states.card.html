<!-- @dsCard group="Motion" viewport="700x190" name="Interaction states" subtitle="0.18s everywhere: brighten + 1px lift, border opacity, 4px arrow slide" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-core);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);padding:16px 18px}
.sw{border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:96px;box-shadow:var(--shadow-card)}
.sw b{font-size:13px;font-weight:700;display:block}.sw span{font-size:11.5px;font-family:ui-monospace,monospace;opacity:.85}
.row{display:grid;gap:10px}.d{transition:var(--dur-fast)}.p:hover{filter:var(--brighten-hover);transform:var(--lift-hover)}.g:hover{border-color:var(--border-ghost-hover)!important}.la:hover svg{transform:translateX(4px)}</style></head><body><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<a class="d p" style="background:var(--gradient-primary);color:#fff;border-radius:9999px;padding:16px 28px;font-weight:600;font-size:15px;text-decoration:none">Hover me · brighten 1.06 + lift 1px</a>
<a class="d g" style="border:1.5px solid var(--border-ghost);color:var(--ink-heading);border-radius:9999px;padding:16px 28px;font-weight:600;font-size:15px;text-decoration:none">Ghost · border .2 → .45</a>
<a class="la" style="display:inline-flex;gap:8px;align-items:center;font-weight:600;color:var(--ink-heading);text-decoration:none;font-size:15px">Link arrow<svg class="d" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a></div>
<div style="margin-top:14px;font-size:13px;color:var(--muted);max-width:620px">No bounces, no scale-downs on press, no entrance animations on scroll. The only looping motion in the system is the 2.4s map ping.</div></body></html>
