<!-- @dsCard group="Colors" viewport="700x170" name="Navy & dark panels" subtitle="Hero gradient at 160°, footer flat #0C2547" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-core);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);padding:16px 18px}
.sw{border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:96px;box-shadow:var(--shadow-card)}
.sw b{font-size:13px;font-weight:700;display:block}.sw span{font-size:11.5px;font-family:ui-monospace,monospace;opacity:.85}
.row{display:grid;gap:10px}</style></head><body><div class="row" style="grid-template-columns:repeat(4,1fr)">
<div class="sw" style="background:#0A1936;color:#fff"><b>Navy</b><span>--navy</span><span>#0A1936</span></div><div class="sw" style="background:#0A1F3D;color:#fff"><b>Navy mid</b><span>--navy-mid</span><span>#0A1F3D</span></div><div class="sw" style="background:#091C3D;color:#fff"><b>Navy 2</b><span>--navy-2</span><span>#091C3D</span></div><div class="sw" style="background:#0C2547;color:#fff"><b>Panel</b><span>--navy-panel</span><span>#0C2547</span></div></div>
<div style="margin-top:10px;height:44px;border-radius:12px;background:var(--gradient-dark);color:#fff;font-size:12.5px;display:flex;align-items:center;padding:0 14px">--gradient-dark · linear-gradient(160deg, navy, navy-mid 55%, navy-2)</div></body></html>
