<!-- @dsCard group="Colors" viewport="700x160" name="Copy on navy" subtitle="Four opacities of #E2EBF5 for text over dark panels" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--navy);font-family:var(--font-core);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);padding:18px}
.sw{border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:96px;box-shadow:var(--shadow-card)}
.sw b{font-size:13px;font-weight:700;display:block}.sw span{font-size:11.5px;font-family:ui-monospace,monospace;opacity:.85}
.row{display:grid;gap:10px}</style></head><body><div style="display:grid;gap:9px">
<div style="color:#fff;font-size:17px;font-weight:600">--on-navy · #FFFFFF · headings</div>
<div style="color:var(--on-navy-body);font-size:15px">--on-navy-body · rgba(226,235,245,.9) · lead paragraphs</div>
<div style="color:var(--on-navy-soft);font-size:14.5px">--on-navy-soft · .82 · labels and result rows</div>
<div style="color:var(--on-navy-muted);font-size:13px">--on-navy-muted · .75 · captions</div>
<div style="color:var(--on-navy-faint);font-size:12.5px">--on-navy-faint · .6 · legal, disclaimers</div></div></body></html>
