<!-- @dsCard group="Shape" viewport="700x150" name="Hero shape" subtitle="Dark panels end in a 40px bottom radius with a 200° sheen" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-core);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);padding:0}
.sw{border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:96px;box-shadow:var(--shadow-card)}
.sw b{font-size:13px;font-weight:700;display:block}.sw span{font-size:11.5px;font-family:ui-monospace,monospace;opacity:.85}
.row{display:grid;gap:10px}</style></head><body><div style="background:var(--gradient-dark);border-radius:0 0 40px 40px;padding:26px 24px 30px;position:relative;overflow:hidden">
<div style="position:absolute;inset:0;background:var(--gradient-sheen);pointer-events:none"></div>
<div style="position:relative;color:#fff;font-size:22px;font-weight:600">Hero: --radius-hero + --gradient-sheen</div>
<div style="position:relative;color:var(--on-navy-body);font-size:13.5px;margin-top:6px">The 5%-white diagonal wash at 200° is the only decoration on navy.</div></div></body></html>
