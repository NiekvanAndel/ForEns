<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-core);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);padding:16px 18px}
.sw{border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:96px;box-shadow:var(--shadow-card)}
.sw b{font-size:13px;font-weight:700;display:block}.sw span{font-size:11.5px;font-family:ui-monospace,monospace;opacity:.85}
.row{display:grid;gap:10px}</style></head><body><div style="display:grid;gap:4px;color:var(--ink-heading);font-size:19px">
<div style="font-weight:300">300 Light — decorative only</div>
<div style="font-weight:400">400 Regular — body copy</div>
<div style="font-weight:500">500 Medium — nav, tab labels</div>
<div style="font-weight:600">600 Semibold — headings, buttons</div>
<div style="font-weight:700">700 Bold — eyebrows, values</div>
<div style="font-weight:800">800 Black — wordmark only</div></div></body></html>
