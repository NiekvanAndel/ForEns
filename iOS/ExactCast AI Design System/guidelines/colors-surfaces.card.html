<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Cream page, cream-2 alternating section, pure white cards" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-core);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);padding:16px 18px}
.sw{border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:96px;box-shadow:var(--shadow-card)}
.sw b{font-size:13px;font-weight:700;display:block}.sw span{font-size:11.5px;font-family:ui-monospace,monospace;opacity:.85}
.row{display:grid;gap:10px}</style></head><body><div class="row" style="grid-template-columns:repeat(3,1fr)">
<div class="sw" style="background:#F4EEE3;color:var(--ink-heading)"><b>Cream</b><span>--cream</span><span>#F4EEE3</span></div><div class="sw" style="background:#FBF8F3;color:var(--ink-heading)"><b>Cream 2</b><span>--cream-2</span><span>#FBF8F3</span></div><div class="sw" style="background:#FFFFFF;color:var(--ink-heading)"><b>White</b><span>--white</span><span>#FFFFFF</span></div></div></body></html>
