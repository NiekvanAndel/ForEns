<!-- @dsCard group="Motion" viewport="700x160" name="Location ping" subtitle="The single looping animation: 2.4s expanding ring on "you are here"" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-core);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);padding:16px 18px}
.sw{border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:96px;box-shadow:var(--shadow-card)}
.sw b{font-size:13px;font-weight:700;display:block}.sw span{font-size:11.5px;font-family:ui-monospace,monospace;opacity:.85}
.row{display:grid;gap:10px}</style></head><body><div style="position:relative;height:119px;border-radius:16px;overflow:hidden;background:linear-gradient(150deg,var(--map-land-1),var(--map-land-2) 60%,var(--map-land-3));box-shadow:var(--shadow-card)">
<div style="position:absolute;left:0;right:0;top:58px;height:8px;background:var(--map-water);opacity:.85"></div>
<div style="position:absolute;left:40%;top:52%;width:23px;height:23px;border-radius:50%;background:var(--ink-heading);border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:var(--shadow-pin)">
<div style="position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(12,37,71,.35);animation:ec-pulse 2.4s infinite"></div></div>
<div style="position:absolute;left:66%;top:51%;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--green-dark);transform:translate(-50%,-50%);box-shadow:var(--shadow-pin)"></div>
<div style="position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border-radius:10px;padding:7px 11px;font-size:12px;color:var(--ink-heading);box-shadow:var(--shadow-float)">Jij · station uit het netwerk</div></div></body></html>
