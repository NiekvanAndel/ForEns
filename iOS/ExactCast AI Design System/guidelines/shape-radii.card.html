<!-- @dsCard group="Shape" viewport="700x170" name="Corner radii" subtitle="16px web card, 24px app card, 9999px pills" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--cream);font-family:var(--font-core);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);padding:16px 18px}
.sw{border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;height:96px;box-shadow:var(--shadow-card)}
.sw b{font-size:13px;font-weight:700;display:block}.sw span{font-size:11.5px;font-family:ui-monospace,monospace;opacity:.85}
.row{display:grid;gap:10px}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap">
<div style="width:110px;height:70px;background:#fff;box-shadow:var(--shadow-card);border-radius:10px;display:flex;align-items:flex-end;padding:8px;font-size:11.5px;color:var(--muted)">10 field</div>
<div style="width:110px;height:70px;background:#fff;box-shadow:var(--shadow-card);border-radius:12px;display:flex;align-items:flex-end;padding:8px;font-size:11.5px;color:var(--muted)">12 tile</div>
<div style="width:110px;height:70px;background:#fff;box-shadow:var(--shadow-card);border-radius:16px;display:flex;align-items:flex-end;padding:8px;font-size:11.5px;color:var(--muted)">16 card</div>
<div style="width:110px;height:70px;background:#fff;box-shadow:var(--shadow-card);border-radius:24px;display:flex;align-items:flex-end;padding:8px;font-size:11.5px;color:var(--muted)">24 app</div>
<div style="width:110px;height:70px;background:#fff;box-shadow:var(--shadow-card);border-radius:28px;display:flex;align-items:flex-end;padding:8px;font-size:11.5px;color:var(--muted)">28 band</div>
<div style="padding:16px 28px;background:var(--gradient-primary);color:#fff;border-radius:9999px;font-weight:600;font-size:14px">9999 pill</div></div></body></html>
